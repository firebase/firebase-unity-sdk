# Workflow to handle building the Unity SDK on windows
name: Build windows (SubWorkflow)

on:
  workflow_call:
    inputs:
      unity_version:
        description: 'Unity version'
        default: '2022'
        required: true
        type: string
      firebase_cpp_sdk_version:
        description: 'Firebase CPP SDK version to build against (The branch, tag or SHA to checkout)'
        default: ''
        required: false
        type: string
      unity_branch:
        description: 'Unity branch to build against, empty means current branch'
        default: ''
        type: string
      apis:
        description: 'CSV of apis to build and test'
        default: 'analytics,app_check,auth,crashlytics,database,firebaseai,firestore,functions,installations,messaging,remote_config,storage'
        required: true
        type: string
      unity_platform_name:
        description: 'The platform name Unity should install with'
        default: ''
        required: true
        type: string
      # Additional CMake flags to use
      additional_cmake_flags:
        description: 'Additional flags to pass into CMake'
        default: ''
        required: false
        type: string

permissions:
  contents: read

jobs:
  build_desktop:
    name: build-windows-unity${{inputs.unity_version}}-CPP${{ inputs.firebase_cpp_sdk_version }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
 
    steps:
      - uses: lukka/get-cmake@80ed063af494e28dd56b85fb7a630f2f8f55ceed # ratchet:lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.31.0"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          submodules: true
          ref: ${{ inputs.unity_branch }}
          fetch-depth: 0
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Support longpaths
        run: git config --system core.longpaths true

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # ratchet:actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: Add msbuild to PATH (windows)
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # ratchet:microsoft/setup-msbuild@v3

      - name: Install python deps
        shell: bash
        run: |
          pip install -r scripts/gha/requirements.txt

      - id: unity_setup
        uses: ./gha/unity
        timeout-minutes: 30
        with:
          version: ${{ inputs.unity_version }}
          platforms: ${{ inputs.unity_platform_name }}

      - name: Build SDK (Windows)
        timeout-minutes: 90
        shell: bash
        run: |
          # TODO add handling cmake_extras
          CLEAN_APIS=$(echo ${INPUTS_APIS} | tr -d "'" | tr -d "\"")
          python scripts/build_scripts/build_zips.py --gha --platform=windows --unity_root="$UNITY_ROOT_DIR" --apis=${CLEAN_APIS}
        env:
          INPUTS_APIS: ${{ inputs.apis }}

      - name: Check zip file
        shell: bash
        run: |
          if [ -f windows_unity/*.zip ]; then
            echo "windows_unity zip created."
          else
            echo "Fail to create windows_unity zip."
            exit 1
          fi

      - name: Upload Build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7
        with:
          name: windows_unity
          path: windows_unity/*.zip
